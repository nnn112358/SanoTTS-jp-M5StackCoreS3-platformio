[env:m5stack-cores3]
; 公式の espressif32 は arduino-esp32 2.0.17 で止まっているので pioarduino (3.x) を使う
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = m5stack-cores3
framework = arduino

; 漢字用 (16 MB flash)。extras/partitions/ からコピーしたもの
board_build.partitions = sanotts_16mb.csv

monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

lib_deps =
    https://github.com/ayutaz/sanoTTS-jp/releases/latest/download/sanoTTS-jp-arduino.zip
    https://github.com/ayutaz/sanoTTS-jp/releases/latest/download/sanoTTS-jp-voice-tsukuyomi-v4.zip
    m5stack/M5Unified@0.2.22
    m5stack/M5GFX@0.2.29
    meganetaaan/M5Stack-Avatar@0.10.0
